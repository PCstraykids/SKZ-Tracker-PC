<head>
<meta charset="UTF-8">
<title>SKZ Photocard Tracker</title>
<style>
body {
    background: #2b2f3a;
    color: white;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
}
header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 50px;
    background: #3a3f51;
}
h1 { margin: 0; font-size: 1.8em; }
.select-search { display: flex; align-items: center; gap: 15px; }
select, input[type="text"] {
    padding: 8px 12px;
    border-radius: 8px;
    border: none;
    font-size: 1em;
    background: #2b3348;
    color: white;
    cursor: pointer;
}
input[type="text"]::placeholder { color: #aaa; }
.members {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin: 20px 0;
}
.member-btn {
    padding: 10px 15px;
    border-radius: 8px;
    border: none;
    background: #3a3f51;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}
.member-btn:hover { background: #ff4d4d; color: #fff; }
.member-btn.active { background: #ff4d4d; color: #fff; }
#albumDropdown { width: 90%; margin: 20px auto; font-size: 1.2em; font-weight: bold; color: #ffcc00; text-align: center; }
#photocardTable {
    width: 90%; margin: 0 auto 40px; border-collapse: collapse;
    background: #1e1e1e; border-radius: 8px; overflow: hidden; display: none;
}
th, td { padding: 12px; text-align: center; border-bottom: 1px solid #333; }
th { background: #3a3f51; }
td img { width: 60px; border-radius: 6px; }
input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
#progress { width: 90%; margin: 20px auto; text-align: right; font-weight: bold; color: #ffcc00; }
</style>
</head>
<body>

<header>
<h1>SKZ Photocard Tracker</h1>
<div class="select-search">

// Elementi
const albumSelect=document.getElementById("albumSelect");
const photocardTable=document.getElementById("photocardTable");
const tbody=photocardTable.querySelector("tbody");
const progressEl=document.getElementById("progress");

function populateAlbumMenu(category){

albumSelect.innerHTML='<option value="">Select album</option>';

let filtered=photocardData.filter(c=>c.category===category);

const albums=[...new Set(filtered.map(c=>c.album))];

albums.forEach(album=>{

const total=filtered.filter(c=>c.album===album).length;

const option=document.createElement("option");
option.value=album;
option.dataset.total=total;
option.innerText=`${album} - 0/${total} (0%)`;

albumSelect.appendChild(option);

});

}

document.getElementById("category").addEventListener("change",()=>{

const category=document.getElementById("category").value;

populateAlbumMenu(category);

photocardTable.style.display="none";

progressEl.innerText="Completion: 0%";

});

albumSelect.addEventListener("change",()=>{

const album = albumSelect.value;
const category = document.getElementById("category").value;

tbody.innerHTML="";

if(!album){
    photocardTable.style.display = "none";
    progressEl.innerText = "Completion: 0%";
    return;

}
const filtered = photocardData.filter(c => c.album === album && c.category === category);

filtered.forEach(c => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td><input type="checkbox"></td><td>${c.type}</td><td>${c.member}</td><td><img src="${c.img}" alt="Photocard"></td>`;
    tr.querySelector("input").addEventListener("change", saveState);
    tbody.appendChild(tr);
});
photocardTable.style.display = "table";
loadState();

});

function saveState(){

const rows=tbody.querySelectorAll("tr");

const album=albumSelect.value;

const option=Array.from(albumSelect.options).find(o=>o.value===album);

const total=parseInt(option.dataset.total);

const checked=Array.from(rows).filter(r=>r.querySelector("input").checked).length;

option.innerText=`${album} - ${checked}/${total} (${Math.round(checked/total*100)}%)`;

const states={};

rows.forEach((tr,i)=>states[i]=tr.querySelector("input").checked);

localStorage.setItem(`photocardState-${album}`,JSON.stringify(states));

updateProgress();

}

function loadState(){

const album=albumSelect.value;

if(!album)return;

const rows=tbody.querySelectorAll("tr");

const states=JSON.parse(localStorage.getItem(`photocardState-${album}`))||{};

rows.forEach((tr,i)=>tr.querySelector("input").checked=!!states[i]);

saveState();

}

function updateProgress(){

const rows=tbody.querySelectorAll("tr");

const checked=Array.from(rows).filter(r=>r.querySelector("input").checked).length;

const total=rows.length;

progressEl.innerText=`Completion: ${checked}/${total} (${total?Math.round(checked/total*100):0}%)`;

}

document.querySelectorAll(".member-btn").forEach(btn=>{

btn.addEventListener("click",()=>{

document.querySelectorAll(".member-btn").forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

const member=btn.dataset.member;

tbody.querySelectorAll("tr").forEach(tr=>{

tr.style.display=(member==="OT8"||tr.children[2].innerText.includes(member))?"table-row":"none";

});

});

});

populateAlbumMenu(document.getElementById("category").value);

document.getElementById("search").addEventListener("input", function () {
    const q = this.value.toLowerCase();
    tbody.innerHTML = "";

    photocardData.forEach(c => {
        const text = (c.album + ' ' + c.member + ' ' + c.type).toLowerCase();
        if (text.includes(q)) {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td><input type="checkbox"></td>
                <td>${c.type}</td>
                <td>${c.member}</td>
                <td><img src="${c.img}" alt="Photocard"></td>
            `;
            tr.querySelector("input").addEventListener("change", saveState);
            tbody.appendChild(tr);
        }
    });

    photocardTable.style.display = tbody.children.length > 0 ? "table" : "none";
    updateProgress();
});
</script>
