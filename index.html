<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SKZ Photocard Tracker</title>
<style>
body {
    background: #2b2f3a;
    color: white;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
}
header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 50px;
    background: #3a3f51;
}
h1 { margin: 0; font-size: 1.8em; }
.select-search { display: flex; align-items: center; gap: 15px; }
select, input[type="text"] {
    padding: 8px 12px;
    border-radius: 8px;
    border: none;
    font-size: 1em;
    background: #2b3348;
    color: white;
    cursor: pointer;
}
input[type="text"]::placeholder { color: #aaa; }
.members {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin: 20px 0;
}
.member-btn {
    padding: 10px 15px;
    border-radius: 8px;
    border: none;
    background: #3a3f51;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}
.member-btn:hover { background: #ff4d4d; color: #fff; }
.member-btn.active { background: #ff4d4d; color: #fff; }
#albumDropdown { width: 90%; margin: 20px auto; font-size: 1.2em; font-weight: bold; color: #ffcc00; text-align: center; }
#photocardTable {
    width: 90%; margin: 0 auto 40px; border-collapse: collapse;
    background: #1e1e1e; border-radius: 8px; overflow: hidden; display: none;
}
th, td { padding: 12px; text-align: center; border-bottom: 1px solid #333; }
th { background: #3a3f51; }
td img { width: 60px; border-radius: 6px; }
input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
#progress { width: 90%; margin: 20px auto; text-align: right; font-weight: bold; color: #ffcc00; }
</style>
</head>
<body>

<header>
    <h1>SKZ Photocard Tracker</h1>
    <div class="select-search">
        <select id="category">
            <option value="albumCoreani">Album Korean</option>
            <option value="albumGiapponesi">Album Japan</option>
            <option value="pobCoreano">POB Korean</option>
            <option value="pobGiapponese">POB Japan</option>
        </select>
        <input type="text" id="search" placeholder="Find Photocard...">
    </div>
</header>

<div class="members" id="membersContainer"></div>

<div id="albumDropdown">
    <select id="albumSelect">
        <option value="">Select album</option>
    </select>
</div>

<table id="photocardTable">
    <thead>
        <tr>
            <th>Check</th>
            <th>Type</th>
            <th>Member</th>
            <th>Photocard</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<p id="progress">Completion: 0%</p>

<script>
// Membri
const members = ["Bang Chan","Lee Know","Changbin","Hyunjin","HAN","Felix","Seungmin","I.N.","OT8"];
const membersContainer = document.getElementById("membersContainer");
members.forEach(m => {
    const btn = document.createElement("button");
    btn.className = "member-btn";
    btn.innerText = m;
    btn.dataset.member = m;
    membersContainer.appendChild(btn);
});

// Photocard data
const photocardData = [
    {album: "Mixtape", type: "Making Vr", member: "Bang Chan", img: "https://i.postimg.cc/zDdFvW91/Mixtape-Chan-Photocard-Making-Ver.jpg"},
    {album: "Mixtape", type: "Selfie Vr", member: "Bang Chan", img: "https://i.postimg.cc/pTMkRHhC/Bangchan-MIXTAPE-Selfie-ver.jpg"},
    {album: "Mixtape", type: "Making Vr", member: "Lee Know", img: "https://i.postimg.cc/vBy7Ctk5/MIXTAPE-Making-Ver.jpg"},
    {album: "Mixtape", type: "Selfie Vr", member: "Lee Know", img: "https://i.postimg.cc/t4VhTcjG/Mixtape-LEE-KNOW.jpg"},
    {album: "Mixtape", type: "Making Vr", member: "Changbin", img: "https://i.postimg.cc/26HqTdDn/39552e258cd69f91f4f383887ef31a27.jpg"},
    {album: "Mixtape", type: "Selfie Vr", member: "Changbin", img: "https://i.postimg.cc/T38KkYZZ/cf30b5a68bd8583970a8ce63523af6d2.jpg"},
    {album: "Mixtape", type: "Making Vr", member: "Hyunjin", img: "https://i.postimg.cc/RFbFwM7w/mixtape-hyunjin-selfie-photocard.jpg"},
    {album: "Mixtape", type: "Selfie Vr", member: "Hyunjin", img: "https://i.postimg.cc/tRwJT4C4/16538b248dba8f4ee621c35f19de6b75.jpg"},
    {album: "Mixtape", type: "Making Vr", member: "HAN", img: "https://i.postimg.cc/SsjQSwBL/Han-Mixtape-(Behind-ver-).jpg"},
    {album: "Mixtape", type: "Selfie Vr", member: "HAN", img: "https://i.postimg.cc/1z7nrcPK/Mixtape-Han-Photocard-Selfie-Ver.jpg"},
    {album: "Mixtape", type: "Making Vr", member: "Felix", img: "https://i.postimg.cc/bwzZXFww/b8e872eb0fb6847819a3688b6d5ad6ff.jpg"},
    {album: "Mixtape", type: "Selfie Vr", member: "Felix", img: "https://i.postimg.cc/85r5d2ty/0ffaf0385aeb41fa8cb4265ec1e6f7e6.jpg"},
    {album: "Mixtape", type: "Making Vr", member: "Seungmin", img: "https://i.postimg.cc/WbV3rfrr/Stray-kids-Seungmin-photocard-Mixtape.jpg"},
    {album: "Mixtape", type: "Selfie Vr", member: "Seungmin", img: "https://i.postimg.cc/VN2sN7mB/MIXTAPE-Selfie-Ver.jpg"},
    {album: "Mixtape", type: "Making Vr", member: "I.N.", img: "https://i.postimg.cc/ZnxJV432/8dc9edf65472b3e19c07f93ce356ae9f.jpg"},
    {album: "Mixtape", type: "Selfie Vr", member: "I.N.", img: "https://i.postimg.cc/d1MvFL9c/Yang-Jeongin.jpg"},
    
];

// Elementi
const albumSelect = document.getElementById("albumSelect");
const photocardTable = document.getElementById("photocardTable");
const tbody = photocardTable.querySelector("tbody");
const progressEl = document.getElementById("progress");

// Popola menu album dinamico in base alla categoria selezionata
function populateAlbumMenu(category) {
    albumSelect.innerHTML = '<option value="">Select album</option>';
    let filtered = photocardData.filter(c => {
        if(category === "albumCoreani") return true; // mostra tutto per ora
        if(category === "albumGiapponesi") return false;
        if(category === "pobCoreano") return false;
        if(category === "pobGiapponese") return false;
        return false;
    });
    const albums = [...new Set(filtered.map(c => c.album))];
    albums.forEach(album => {
        const total = filtered.filter(c => c.album === album).length;
        const option = document.createElement("option");
        option.value = album;
        option.dataset.total = total;
        option.innerText = `${album} - 0/${total} (0%)`;
        albumSelect.appendChild(option);
    });
}

// Cambia categoria
document.getElementById("category").addEventListener("change", () => {
    const category = document.getElementById("category").value;
    populateAlbumMenu(category);
    photocardTable.style.display = "none";
    progressEl.innerText = "Completion: 0%";
});

// Seleziona album
albumSelect.addEventListener("change", () => {
    const album = albumSelect.value;
    tbody.innerHTML = "";
    if (!album) { photocardTable.style.display="none"; progressEl.innerText="Completion: 0%"; return; }
    const filtered = photocardData.filter(c=>c.album===album);
    filtered.forEach(c=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `<td><input type="checkbox"></td><td>${c.type}</td><td>${c.member}</td><td><img src="${c.img}" alt="Photocard"></td>`;
        tr.querySelector("input").addEventListener("change", saveState);
        tbody.appendChild(tr);
    });
    photocardTable.style.display="table";
    loadState();
});

// Salva stato checkbox
function saveState(){
    const rows = tbody.querySelectorAll("tr");
    const album = albumSelect.value;
    const option = Array.from(albumSelect.options).find(o=>o.value===album);
    const total = parseInt(option.dataset.total);
    const checked = Array.from(rows).filter(r=>r.querySelector("input").checked).length;
    option.innerText = `${album} - ${checked}/${total} (${Math.round(checked/total*100)}%)`;
    const states = {};
    rows.forEach((tr,i)=>states[i]=tr.querySelector("input").checked);
    localStorage.setItem(`photocardState-${album}`, JSON.stringify(states));
    updateProgress();
}

// Carica stato checkbox
function loadState(){
    const album = albumSelect.value;
    if(!album) return;
    const rows = tbody.querySelectorAll("tr");
    const states = JSON.parse(localStorage.getItem(`photocardState-${album}`))||{};
    rows.forEach((tr,i)=>tr.querySelector("input").checked=!!states[i]);
    saveState();
}

// Aggiorna barra progresso
function updateProgress(){
    const rows = tbody.querySelectorAll("tr");
    const checked = Array.from(rows).filter(r=>r.querySelector("input").checked).length;
    const total = rows.length;
    progressEl.innerText = `Completion: ${checked}/${total} (${total?Math.round(checked/total*100):0}%)`;
}

// Filtra per membro
document.querySelectorAll(".member-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
        document.querySelectorAll(".member-btn").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        const member = btn.dataset.member;
        tbody.querySelectorAll("tr").forEach(tr=>{
            tr.style.display = (member==="OT8"||tr.children[2].innerText===member)?"table-row":"none";
        });
    });
});
// Popola subito il menù album all'avvio
    populateAlbumMenu (document.getElementById("category").value);
// Ricerca
document.getElementById("search").addEventListener("input", function(){
    const q = this.value.toLowerCase();
    tbody.querySelectorAll("tr").forEach(tr=>{
        const name = tr.children[3].innerText.toLowerCase();
        tr.style.display = name.includes(q)?"table-row":"none";
    });
});
</script>

</body>
</html>
