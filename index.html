<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SKZ Photocard Tracker - Tabella</title>
<style>
body {
    background: #2b2f3a;
    color: white;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
}

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 50px;
    background: #3a3f51;
}

h1 {
    margin: 0;
    font-size: 1.8em;
}

.select-search {
    display: flex;
    align-items: center;
    gap: 15px;
}

select, input[type="text"] {
    padding: 8px 12px;
    border-radius: 8px;
    border: none;
    font-size: 1em;
    background: #2b3348;
    color: white;
}

input[type="text"]::placeholder {
    color: #aaa;
}

/* Barra dei membri */
.members {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin: 20px 0;
}

.member-btn {
    padding: 10px 15px;
    border-radius: 8px;
    border: none;
    background: #3a3f51;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

.member-btn:hover {
    background: #ff4d4d;
    color: #fff;
}

.member-btn.active {
    background: #ff4d4d;
    color: #fff;
}

/* Tabella photocard */
#progress {
    width: 90%;
    margin: 20px auto;
    text-align: right;
    font-weight: bold;
    color: #ffcc00;
}

table {
    width: 90%;
    margin: 0 auto 40px;
    border-collapse: collapse;
    background: #1e1e1e;
    border-radius: 8px;
    overflow: hidden;
}

th, td {
    padding: 12px;
    text-align: center;
    border-bottom: 1px solid #333;
}

th {
    background: #3a3f51;
}

td img {
    width: 80px;
    border-radius: 6px;
}

input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
}
</style>
</head>
<body>

<header>
    <h1>SKZ Photocard Tracker</h1>
    <div class="select-search">
        <input type="text" id="search" placeholder="Cerca photocard...">
    </div>
</header>

<!-- Barra dei membri -->
<div class="members" id="membersContainer"></div>

<!-- Barra progresso -->
<p id="progress">Completion: 0%</p>

<!-- Tabella photocard -->
<table id="photocardTable">
    <thead>
        <tr>
            <th>Check</th>
            <th>Type</th>
            <th>Member</th>
            <th>Photocard</th>
        </tr>
    </thead>
    <tbody>
        <!-- Righe generate da JS -->
    </tbody>
</table>

<script>
// Lista membri
const members = ["Bang Chan","Lee Know","Changbin","Hyunjin","HAN","Felix","Seungmin","I.N.","OT8"];
const membersContainer = document.getElementById("membersContainer");

// Photocard array
const photocardData = [
    {type: "Album Coreano", member: "Bang Chan", name: "Bang Chan PC 1", img: "https://via.placeholder.com/80"},
    {type: "Album Coreano", member: "Lee Know", name: "Lee Know PC 1", img: "https://via.placeholder.com/80"},
    {type: "Album Coreano", member: "Changbin", name: "Changbin PC 1", img: "https://via.placeholder.com/80"},
    {type: "Album Coreano", member: "Hyunjin", name: "Hyunjin PC 1", img: "https://via.placeholder.com/80"},
    {type: "Album Coreano", member: "HAN", name: "HAN PC 1", img: "https://via.placeholder.com/80"},
    {type: "Album Coreano", member: "Felix", name: "Felix PC 1", img: "https://via.placeholder.com/80"},
    {type: "Album Coreano", member: "Seungmin", name: "Seungmin PC 1", img: "https://via.placeholder.com/80"},
    {type: "Album Coreano", member: "I.N.", name: "I.N. PC 1", img: "https://via.placeholder.com/80"},
];

// Genera bottoni membri
members.forEach(member => {
    const btn = document.createElement("button");
    btn.className = "member-btn";
    btn.innerText = member;
    btn.dataset.member = member;
    membersContainer.appendChild(btn);
});

// Genera righe tabella
const tbody = document.querySelector("#photocardTable tbody");
const progressEl = document.getElementById("progress");

photocardData.forEach((card, index) => {
    const tr = document.createElement("tr");

    const tdCheck = document.createElement("td");
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.addEventListener("change", saveState);
    tdCheck.appendChild(checkbox);

    const tdType = document.createElement("td");
    tdType.innerText = card.type;

    const tdMember = document.createElement("td");
    tdMember.innerText = card.member;

    const tdImg = document.createElement("td");
    const img = document.createElement("img");
    img.src = card.img;
    img.alt = card.name;
    tdImg.appendChild(img);

    tr.appendChild(tdCheck);
    tr.appendChild(tdType);
    tr.appendChild(tdMember);
    tr.appendChild(tdImg);

    tbody.appendChild(tr);
});

// Funzioni checkbox e progresso
function saveState() {
    const states = {};
    document.querySelectorAll("#photocardTable tbody tr").forEach((tr,index) => {
        const checkbox = tr.querySelector("input[type=checkbox]");
        states[index] = checkbox.checked;
    });
    localStorage.setItem("photocardState", JSON.stringify(states));
    updateProgress();
}

function loadState() {
    const states = JSON.parse(localStorage.getItem("photocardState")) || {};
    document.querySelectorAll("#photocardTable tbody tr").forEach((tr,index) => {
        const checkbox = tr.querySelector("input[type=checkbox]");
        if(states[index]) checkbox.checked = true;
    });
    updateProgress();
}

function updateProgress() {
    const checkboxes = document.querySelectorAll("#photocardTable tbody input[type=checkbox]");
    const checked = document.querySelectorAll("#photocardTable tbody input[type=checkbox]:checked");
    const percent = Math.round((checked.length / checkboxes.length) * 100);
    progressEl.innerText = `Completion: ${checked.length}/${checkboxes.length} (${percent}%)`;
}

loadState();

// Filtro membri sulla tabella
const memberButtons = document.querySelectorAll(".member-btn");
const rows = document.querySelectorAll("#photocardTable tbody tr");

memberButtons.forEach(btn => {
    btn.addEventListener("click", () => {
        memberButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const member = btn.dataset.member;

        rows.forEach((tr, i) => {
            const rowMember = photocardData[i].member;
            if(member === "OT8") {
                tr.style.display = "table-row";
            } else {
                tr.style.display = rowMember === member ? "table-row" : "none";
            }
        });
    });
});

// Ricerca tabella
document.getElementById("search").addEventListener("input", function() {
    const query = this.value.toLowerCase();
    rows.forEach((tr, i) => {
        const name = photocardData[i].name.toLowerCase();
        tr.style.display = name.includes(query) ? "table-row" : "none";
    });
});
</script>

</body>
</html>
