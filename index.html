<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SKZ Photocard Tracker</title>
<style>
body {
    background: #2b2f3a; /* grigio scuro-azzurro */
    color: white;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
}

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 50px;
    background: #3a3f51; /* leggermente più chiaro */
}

h1 {
    margin: 0;
    font-size: 1.8em;
}

.select-search {
    display: flex;
    align-items: center;
    gap: 15px;
}

/* Menu a tendina */
select {
    padding: 8px 12px;
    border-radius: 8px;
    border: none;
    font-size: 1em;
    background: #2b3348;
    color: white;
    cursor: pointer;
}

/* Campo di ricerca */
input[type="text"] {
    padding: 8px 12px;
    border-radius: 8px;
    border: none;
    font-size: 1em;
    background: #2b3348;
    color: white;
}

input[type="text"]::placeholder {
    color: #aaa;
}

.cards {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    padding: 30px;
    gap: 20px;
}

.card {
    background: #1e1e1e;
    border-radius: 10px;
    padding: 10px;
    width: 150px;
    text-align: center;
}

.card img {
    width: 120px;
    border-radius: 8px;
}
</style>
</head>

<body>

<header>
    <h1>SKZ Photocard Tracker</h1>
    <div class="select-search">
        <select id="category">
            <option>Album Coreani</option>
            <option>Album Giapponesi</option>
            <option>POB Coreano</option>
            <option>POB Giapponese</option>
        </select>
        <input type="text" id="search" placeholder="Cerca photocard...">
    </div>
</header>

<div class="cards" id="cardsContainer">
    <!-- Qui potrai aggiungere le card dinamicamente -->
</div>

<script>
// Esempio base di filtro di ricerca
document.getElementById("search").addEventListener("input", function() {
    const query = this.value.toLowerCase();
    const cards = document.querySelectorAll(".card");
    cards.forEach(card => {
        const name = card.querySelector("p").innerText.toLowerCase();
        card.style.display = name.includes(query) ? "block" : "none";
    });
});
</script>

</body>
</html>
