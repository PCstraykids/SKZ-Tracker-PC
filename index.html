<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SKZ Photocard Tracker</title>
<style>
/* Corpo della pagina */
body {
    background: #2b2f3a; /* grigio scuro-azzurro */
    color: white;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
}

/* Header con titolo e selezioni */
header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 50px;
    background: #3a3f51;
}

h1 {
    margin: 0;
    font-size: 1.8em;
}

.select-search {
    display: flex;
    align-items: center;
    gap: 15px;
}

select, input[type="text"] {
    padding: 8px 12px;
    border-radius: 8px;
    border: none;
    font-size: 1em;
    background: #2b3348;
    color: white;
}

input[type="text"]::placeholder {
    color: #aaa;
}

/* Barra dei membri */
.members {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 15px;
    margin: 20px 0;
}

.member-btn {
    padding: 10px 15px;
    border-radius: 8px;
    border: none;
    background: #3a3f51;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

.member-btn:hover {
    background: #f39c12;
    color: #111;
}

/* Container delle card */
.cards {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    padding: 20px;
    gap: 20px;
}

.card {
    background: #1e1e1e;
    border-radius: 10px;
    padding: 10px;
    width: 150px;
    text-align: center;
}

.card img {
    width: 120px;
    border-radius: 8px;
}
</style>
</head>

<body>

<!-- Header con menu a tendina e ricerca -->
<header>
    <h1>SKZ Photocard Tracker</h1>
    <div class="select-search">
        <select id="category">
            <option>Album Coreani</option>
            <option>Album Giapponesi</option>
            <option>POB Coreano</option>
            <option>POB Giapponese</option>
        </select>
        <input type="text" id="search" placeholder="Cerca photocard...">
    </div>
</header>

<!-- Barra dei membri -->
<div class="members">
    <button class="member-btn" data-member="Bang Chan">Bang Chan</button>
    <button class="member-btn" data-member="Lee Know">Lee Know</button>
    <button class="member-btn" data-member="Changbin">Changbin</button>
    <button class="member-btn" data-member="Hyunjin">Hyunjin</button>
    <button class="member-btn" data-member="HAN">HAN</button>
    <button class="member-btn" data-member="Felix">Felix</button>
    <button class="member-btn" data-member="Seungmin">Seungmin</button>
    <button class="member-btn" data-member="I.N.">I.N.</button>
    <button class="member-btn" data-member="OT8">OT8</button>
</div>

<!-- Container per le photocard -->
<div class="cards" id="cardsContainer">
    <!-- Esempio di card -->
    <div class="card" data-member="Bang Chan">
        <img src="https://via.placeholder.com/120">
        <p>Bang Chan PC 1</p>
    </div>
    <div class="card" data-member="Hyunjin">
        <img src="https://via.placeholder.com/120">
        <p>Hyunjin PC 1</p>
    </div>
    <div class="card" data-member="Felix">
        <img src="https://via.placeholder.com/120">
        <p>Felix PC 1</p>
    </div>
    <div class="card" data-member="OT8">
        <img src="https://via.placeholder.com/120">
        <p>OT8 PC 1</p>
    </div>
</div>

<script>
// Filtro per membro
const memberButtons = document.querySelectorAll(".member-btn");
const cards = document.querySelectorAll(".card");

memberButtons.forEach(button => {
    button.addEventListener("click", () => {
        const member = button.getAttribute("data-member");
        cards.forEach(card => {
            if(member === "OT8") {
                card.style.display = "block"; // OT8 mostra tutti i membri
            } else {
                card.style.display = card.getAttribute("data-member") === member ? "block" : "none";
            }
        });
    });
});

// Filtro ricerca
document.getElementById("search").addEventListener("input", function() {
    const query = this.value.toLowerCase();
    cards.forEach(card => {
        const name = card.querySelector("p").innerText.toLowerCase();
        card.style.display = name.includes(query) ? "block" : "none";
    });
});
</script>

</body>
</html>
