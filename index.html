<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SKZ Photocard Tracker</title>
<style>
body {
    background: #2b2f3a;
    color: white;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
}

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 50px;
    background: #3a3f51;
}

h1 {
    margin: 0;
    font-size: 1.8em;
}

.select-search {
    display: flex;
    align-items: center;
    gap: 15px;
}

select, input[type="text"] {
    padding: 8px 12px;
    border-radius: 8px;
    border: none;
    font-size: 1em;
    background: #2b3348;
    color: white;
    cursor: pointer;
}

input[type="text"]::placeholder {
    color: #aaa;
}

.members {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin: 20px 0;
}

.member-btn {
    padding: 10px 15px;
    border-radius: 8px;
    border: none;
    background: #3a3f51;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

.member-btn:hover {
    background: #ff4d4d;
    color: #fff;
}

.member-btn.active {
    background: #ff4d4d;
    color: #fff;
}

#albumDropdown {
    width: 90%;
    margin: 20px auto;
    font-size: 1.2em;
    font-weight: bold;
    color: #ffcc00;
    text-align: center;
}

#photocardTable {
    width: 90%;
    margin: 0 auto 40px;
    border-collapse: collapse;
    background: #1e1e1e;
    border-radius: 8px;
    overflow: hidden;
    display: none; /* inizialmente nascosta */
}

th, td {
    padding: 12px;
    text-align: center;
    border-bottom: 1px solid #333;
}

th {
    background: #3a3f51;
}

td img {
    width: 80px;
    border-radius: 6px;
}

input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
}

#progress {
    width: 90%;
    margin: 20px auto;
    text-align: right;
    font-weight: bold;
    color: #ffcc00;
}
</style>
</head>
<body>

<header>
    <h1>SKZ Photocard Tracker</h1>
    <div class="select-search">
        <!-- Menu principale -->
        <select id="category">
            <option value="albumCoreani">Album Coreani</option>
            <option value="albumGiapponesi">Album Giapponesi</option>
            <option value="pobCoreano">POB Coreano</option>
            <option value="pobGiapponese">POB Giapponese</option>
        </select>
        <input type="text" id="search" placeholder="Cerca photocard...">
    </div>
</header>

<div class="members" id="membersContainer"></div>

<!-- Menu album dinamico -->
<div id="albumDropdown">
    <select id="albumSelect">
        <option value="">Seleziona un album</option>
    </select>
</div>

<table id="photocardTable">
    <thead>
        <tr>
            <th>Check</th>
            <th>Type</th>
            <th>Member</th>
            <th>Photocard</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<p id="progress">Completion: 0%</p>

<script>
// Lista membri
const members = ["Bang Chan","Lee Know","Changbin","Hyunjin","HAN","Felix","Seungmin","I.N.","OT8"];
const membersContainer = document.getElementById("membersContainer");

members.forEach(member => {
    const btn = document.createElement("button");
    btn.className = "member-btn";
    btn.innerText = member;
    btn.dataset.member = member;
    membersContainer.appendChild(btn);
});

// Photocard data
const photocardData = [
    {album: "Mixtape", type: "Album Coreano", member: "Bang Chan", name: "Bang Chan PC 1", img: "https://via.placeholder.com/80"},
    {album: "Mixtape", type: "Album Coreano", member: "Lee Know", name: "Lee Know PC 1", img: "https://via.placeholder.com/80"},
    {album: "Mixtape", type: "Album Coreano", member: "Changbin", name: "Changbin PC 1", img: "https://via.placeholder.com/80"},
    {album: "Mixtape", type: "Album Coreano", member: "Hyunjin", name: "Hyunjin PC 1", img: "https://via.placeholder.com/80"},
    {album: "Mixtape", type: "Album Coreano", member: "HAN", name: "HAN PC 1", img: "https://via.placeholder.com/80"},
    {album: "Mixtape", type: "Album Coreano", member: "Felix", name: "Felix PC 1", img: "https://via.placeholder.com/80"},
    {album: "Mixtape", type: "Album Coreano", member: "Seungmin", name: "Seungmin PC 1", img: "https://via.placeholder.com/80"},
    {album: "Mixtape", type: "Album Coreano", member: "I.N.", name: "I.N. PC 1", img: "https://via.placeholder.com/80"},
];

// Menu album dinamico
const albumSelect = document.getElementById("albumSelect");
const photocardTable = document.getElementById("photocardTable");
const tbody = photocardTable.querySelector("tbody");
const progressEl = document.getElementById("progress");

// Popola il menu album in base alla categoria selezionata
function populateAlbumMenu(category) {
    albumSelect.innerHTML = '<option value="">Seleziona un album</option>';
    let filtered = photocardData.filter(c => {
        if(category === "albumCoreani") return c.type.includes("Album Coreano");
        if(category === "albumGiapponesi") return c.type.includes("Album Giapponese");
        if(category === "pobCoreano") return c.type.includes("POB Coreano");
        if(category === "pobGiapponese") return c.type.includes("POB Giapponese");
        return false;
    });
    const albums = [...new Set(filtered.map(c => c.album))];
    albums.forEach(album => {
        const total = filtered.filter(c => c.album === album).length;
        const option = document.createElement("option");
        option.value = album;
        option.dataset.total = total;
        option.innerText = `${album} - 0/${total} (0%)`;
        albumSelect.appendChild(option);
    });
}

// Quando cambio categoria, aggiorno il menu album
document.getElementById("category").addEventListener("change", () => {
    const category = document.getElementById("category").value;
    populateAlbumMenu(category);
    photocardTable.style.display = "none";
    progressEl.innerText = "Completion: 0%";
});

// Quando seleziono un album, mostro la tabella con le relative righe
albumSelect.addEventListener("change", () => {
    const album = albumSelect.value;
    tbody.innerHTML = "";
    if (!album) {
        photocardTable.style.display = "none";
        progressEl.innerText = "Completion: 0%";
        return;
    }
    const filtered = photocardData.filter(c => c.album === album);
    filtered.forEach(card => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td><input type="checkbox"></td>
            <td>${card.type}</td>
            <td>${card.member}</td>
            <td><img src="${card.img}" alt="${card.name}">${card.name}</td>
        `;
        tr.querySelector("input[type=checkbox]").addEventListener("change", saveState);
        tbody.appendChild(tr);
    });
    photocardTable.style.display = "table";
    loadState();
});

// Salva stato dei checkbox e aggiorna titolo menu
function saveState() {
    const rows = tbody.querySelectorAll("tr");
    const album = albumSelect.value;
    const option = Array.from(albumSelect.options).find(o => o.value === album);
    const total = parseInt(option.dataset.total);
    const checked = Array.from(rows).filter(r => r.querySelector("input[type=checkbox]").checked).length;
    option.innerText = `${album} - ${checked}/${total} (${Math.round((checked / total) * 100)}%)`;
    updateProgress();
    const states = {};
    rows.forEach((tr, i) => states[i] = tr.querySelector("input[type=checkbox]").checked);
    localStorage.setItem(`photocardState-${album}`, JSON.stringify(states));
}

// Carica stato dei checkbox quando cambio album
function loadState() {
    const album = albumSelect.value;
    if (!album) return;
    const rows = tbody.querySelectorAll("tr");
    const states = JSON.parse(localStorage.getItem(`photocardState-${album}`)) || {};
    rows.forEach((tr, i) => tr.querySelector("input[type=checkbox]").checked = !!states[i]);
    saveState();
}

// Aggiorna barra progresso
function updateProgress() {
    const rows = tbody.querySelectorAll("tr");
    const checked = Array.from(rows).filter(r => r.querySelector("input[type=checkbox]").checked).length;
    const total = rows.length;
    progressEl.innerText = `Completion: ${checked}/${total} (${total ? Math.round(checked / total * 100) : 0}%)`;
}

// Filtri membri
const memberButtons = document.querySelectorAll(".member-btn");
memberButtons.forEach(btn => {
    btn.addEventListener("click", () => {
        memberButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const member = btn.dataset.member;
        tbody.querySelectorAll("tr").forEach(tr => {
            const m = tr.children[2].innerText;
            tr.style.display = (member === "OT8" || m === member) ? "table-row" : "none";
        });
    });
});

// Ricerca
document.getElementById("search").addEventListener("input", function () {
    const query = this.value.toLowerCase();
    tbody.querySelectorAll("tr").forEach(tr => {
        const name = tr.children[3].innerText.toLowerCase();
        tr.style.display = name.includes(query) ? "table-row" : "none";
    });
});
</script>

</body>
</html>
