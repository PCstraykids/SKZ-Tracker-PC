<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SKZ Photocard Tracker</title>
<style>
body {
    background: #2b2f3a; 
    color: white;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
}

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 50px;
    background: #3a3f51;
}

h1 {
    margin: 0;
    font-size: 1.8em;
}

.select-search {
    display: flex;
    align-items: center;
    gap: 15px;
}

select, input[type="text"] {
    padding: 8px 12px;
    border-radius: 8px;
    border: none;
    font-size: 1em;
    background: #2b3348;
    color: white;
}

input[type="text"]::placeholder {
    color: #aaa;
}

/* Barra dei membri */
.members {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 15px;
    margin: 20px 0;
}

.member-btn {
    padding: 10px 15px;
    border-radius: 8px;
    border: none;
    background: #3a3f51;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

.member-btn:hover {
    background: #ff4d4d; /* rosso al passaggio del mouse */
    color: #fff;
}

/* Active/selected button */
.member-btn.active {
    background: #ff4d4d; /* rosso quando selezionato */
    color: #fff;
}

/* Container delle card */
.cards {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    padding: 20px;
    gap: 20px;
}

.card {
    background: #1e1e1e;
    border-radius: 10px;
    padding: 10px;
    width: 150px;
    text-align: center;
}

.card img {
    width: 120px;
    border-radius: 8px;
}
</style>
</head>

<body>

<header>
    <h1>SKZ Photocard Tracker</h1>
    <div class="select-search">
        <select id="category">
            <option>Album Coreani</option>
            <option>Album Giapponesi</option>
            <option>POB Coreano</option>
            <option>POB Giapponese</option>
        </select>
        <input type="text" id="search" placeholder="Cerca photocard...">
    </div>
</header>

<div class="members">
    <button class="member-btn" data-member="Bang Chan">Bang Chan</button>
    <button class="member-btn" data-member="Lee Know">Lee Know</button>
    <button class="member-btn" data-member="Changbin">Changbin</button>
    <button class="member-btn" data-member="Hyunjin">Hyunjin</button>
    <button class="member-btn" data-member="HAN">HAN</button>
    <button class="member-btn" data-member="Felix">Felix</button>
    <button class="member-btn" data-member="Seungmin">Seungmin</button>
    <button class="member-btn" data-member="I.N.">I.N.</button>
    <button class="member-btn" data-member="OT8">OT8</button>
</div>

<div class="cards" id="cardsContainer"></div>

<script>
// Array con tutte le photocard
const allCards = [
    {member: "Bang Chan", name: "Bang Chan PC 1", img: "https://via.placeholder.com/120"},
    {member: "Bang Chan", name: "Bang Chan PC 2", img: "https://via.placeholder.com/120"},
    {member: "Lee Know", name: "Lee Know PC 1", img: "https://via.placeholder.com/120"},
    {member: "Changbin", name: "Changbin PC 1", img: "https://via.placeholder.com/120"},
    {member: "Hyunjin", name: "Hyunjin PC 1", img: "https://via.placeholder.com/120"},
    {member: "HAN", name: "HAN PC 1", img: "https://via.placeholder.com/120"},
    {member: "Felix", name: "Felix PC 1", img: "https://via.placeholder.com/120"},
    {member: "Seungmin", name: "Seungmin PC 1", img: "https://via.placeholder.com/120"},
    {member: "I.N.", name: "I.N. PC 1", img: "https://via.placeholder.com/120"},
];

// Genera le card
const container = document.getElementById("cardsContainer");
allCards.forEach(card => {
    const div = document.createElement("div");
    div.className = "card";
    div.setAttribute("data-member", card.member);
    div.innerHTML = `<img src="${card.img}"><p>${card.name}</p>`;
    container.appendChild(div);
});

// Filtra per membro
const memberButtons = document.querySelectorAll(".member-btn");
const cards = document.querySelectorAll(".card");

memberButtons.forEach(button => {
    button.addEventListener("click", () => {
        // Rimuove classe active da tutti i bottoni
        memberButtons.forEach(btn => btn.classList.remove("active"));
        // Aggiunge active al bottone cliccato
        button.classList.add("active");

        const member = button.getAttribute("data-member");
        cards.forEach(card => {
            if(member === "OT8") {
                card.style.display = "block";
            } else {
                card.style.display = card.getAttribute("data-member") === member ? "block" : "none";
            }
        });
    });
});

// Filtro ricerca
document.getElementById("search").addEventListener("input", function() {
    const query = this.value.toLowerCase();
    cards.forEach(card => {
        const name = card.querySelector("p").innerText.toLowerCase();
        card.style.display = name.includes(query) ? "block" : "none";
    });
});
</script>

</body>
</html>
