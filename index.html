<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SKZ Photocard Tracker</title>
<style>
body {
    background: #2b2f3a;
    color: white;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
}

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 50px;
    background: #3a3f51;
}

h1 {
    margin: 0;
    font-size: 1.8em;
}

.select-search {
    display: flex;
    align-items: center;
    gap: 15px;
}

select, input[type="text"] {
    padding: 8px 12px;
    border-radius: 8px;
    border: none;
    font-size: 1em;
    background: #2b3348;
    color: white;
}

input[type="text"]::placeholder {
    color: #aaa;
}

/* Barra dei membri */
.members {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin: 20px 0;
}

.member-btn {
    padding: 10px 15px;
    border-radius: 8px;
    border: none;
    background: #3a3f51;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

.member-btn:hover {
    background: #ff4d4d;
    color: #fff;
}

.member-btn.active {
    background: #ff4d4d;
    color: #fff;
}

/* Container delle card */
.cards {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    padding: 20px;
    gap: 20px;
}

.card {
    background: #1e1e1e;
    border-radius: 10px;
    padding: 10px;
    width: 150px;
    text-align: center;
}

.card img {
    width: 120px;
    border-radius: 8px;
}
</style>
</head>
<body>

<header>
    <h1>SKZ Photocard Tracker</h1>
    <div class="select-search">
        <select id="category">
            <option>Album Coreani</option>
            <option>Album Giapponesi</option>
            <option>POB Coreano</option>
            <option>POB Giapponese</option>
        </select>
        <input type="text" id="search" placeholder="Cerca photocard...">
    </div>
</header>

<!-- Barra dei membri -->
<div class="members" id="membersContainer"></div>

<!-- Container per le card -->
<div class="cards" id="cardsContainer"></div>

<script>
// Lista membri
const members = ["Bang Chan","Lee Know","Changbin","Hyunjin","HAN","Felix","Seungmin","I.N.","OT8"];
const membersContainer = document.getElementById("membersContainer");

// Crea bottoni membri
members.forEach(member => {
    const btn = document.createElement("button");
    btn.className = "member-btn";
    btn.innerText = member;
    btn.dataset.member = member;
    membersContainer.appendChild(btn);
});

// Photocard (almeno 1 per ogni membro)
const allCards = [
    {member: "Bang Chan", name: "Bang Chan PC 1", img: "https://via.placeholder.com/120"},
    {member: "Lee Know", name: "Lee Know PC 1", img: "https://via.placeholder.com/120"},
    {member: "Changbin", name: "Changbin PC 1", img: "https://via.placeholder.com/120"},
    {member: "Hyunjin", name: "Hyunjin PC 1", img: "https://via.placeholder.com/120"},
    {member: "HAN", name: "HAN PC 1", img: "https://via.placeholder.com/120"},
    {member: "Felix", name: "Felix PC 1", img: "https://via.placeholder.com/120"},
    {member: "Seungmin", name: "Seungmin PC 1", img: "https://via.placeholder.com/120"},
    {member: "I.N.", name: "I.N. PC 1", img: "https://via.placeholder.com/120"},
];

// Genera le card nel container
const cardsContainer = document.getElementById("cardsContainer");
allCards.forEach(card => {
    const div = document.createElement("div");
    div.className = "card";
    div.dataset.member = card.member;
    div.innerHTML = `<img src="${card.img}"><p>${card.name}</p>`;
    cardsContainer.appendChild(div);
});

// Selezione bottoni e filtro
const memberButtons = document.querySelectorAll(".member-btn");
const cards = document.querySelectorAll(".card");

memberButtons.forEach(btn => {
    btn.addEventListener("click", () => {
        // Rimuove active da tutti i bottoni
        memberButtons.forEach(b => b.classList.remove("active"));
        // Aggiunge active al cliccato
        btn.classList.add("active");

        const member = btn.dataset.member;
        cards.forEach(card => {
            if(member === "OT8") {
                card.style.display = "block";
            } else {
                card.style.display = card.dataset.member === member ? "block" : "none";
            }
        });
    });
});

// Filtro ricerca
document.getElementById("search").addEventListener("input", function() {
    const query = this.value.toLowerCase();
    cards.forEach(card => {
        const name = card.querySelector("p").innerText.toLowerCase();
        card.style.display = name.includes(query) ? "block" : "none";
    });
});
</script>

</body>
</html>
