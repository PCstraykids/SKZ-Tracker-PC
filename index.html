<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SKZ Photocard Tracker</title>
<style>
/* Corpo della pagina */
body {
    background: #2b2f3a; /* grigio scuro-azzurro */
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding: 0;
}

/* Titolo principale */
h1 {
    margin-top: 50px;
    font-size: 2.5em;
    letter-spacing: 2px;
}

/* Menu verticale */
.menu {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 50px;
}

/* Link menu */
.menu a {
    background: #3a3f51; /* leggermente più chiaro per contrasto */
    color: white;
    text-decoration: none;
    padding: 15px 30px;
    margin: 10px;
    border-radius: 10px;
    width: 200px;
    text-align: center;
    font-size: 1.2em;
    transition: 0.3s;
}

/* Hover dei link */
.menu a:hover {
    background: #f39c12; /* colore brillante al passaggio del mouse */
    color: #111;
}

/* Footer semplice */
footer {
    margin-top: 100px;
    font-size: 0.9em;
    color: #aaa;
}
</style>
</head>

<body>

<h1>SKZ Photocard Tracker</h1>

<div class="menu">
    <a href="#collection">Collezione</a>
    <a href="#wishlist">Wishlist</a>
    <a href="#sets">Set Completi</a>
    <a href="#stats">Statistiche</a>
</div>

<footer>
    &copy; 2026 SKZ Photocard Tracker
</footer>

</body>
</html>
