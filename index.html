<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SKZ Photocard Tracker - Album</title>
  <style>
    body {
      background: #2b2f3a;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .album {
      background: #3a3f51;
      margin: 10px auto;
      padding: 15px;
      border-radius: 8px;
      width: 90%;
      cursor: pointer;
    }

    .album-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 1.2em;
    }

    .album-content {
      margin-top: 10px;
      display: none;
      flex-direction: column;
    }

    .card {
      background: #1e1e1e;
      border-radius: 8px;
      padding: 10px;
      margin: 10px 0;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .card img {
      width: 60px;
      border-radius: 6px;
    }

    .card input[type="checkbox"] {
      cursor: pointer;
    }

    .card-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    #progress {
      width: 90%;
      margin: 20px auto;
      text-align: right;
      font-weight: bold;
      color: #ffcc00;
    }
  </style>
</head>
<body>

  <h1>SKZ Photocard Tracker - Album</h1>
  <p id="progress">Completion: 0%</p>

  <div id="albumsContainer">
    <!-- Le card degli album verranno generate da JS -->
  </div>

<script>
  // Dati delle photocard
  const photocardData = [
    { album: "Album Coreano 1", type: "Album Coreano", member: "Bang Chan", name: "Bang Chan PC 1", img: "https://via.placeholder.com/60" },
    { album: "Album Coreano 1", type: "Album Coreano", member: "Lee Know", name: "Lee Know PC 1", img: "https://via.placeholder.com/60" },
    { album: "Album Coreano 1", type: "Album Coreano", member: "Hyunjin", name: "Hyunjin PC 1", img: "https://via.placeholder.com/60" },
    { album: "Album Coreano 2", type: "Album Coreano", member: "HAN", name: "HAN PC 1", img: "https://via.placeholder.com/60" },
    { album: "Album Coreano 2", type: "Album Coreano", member: "Felix", name: "Felix PC 1", img: "https://via.placeholder.com/60" },
    { album: "Album Coreano 2", type: "Album Coreano", member: "Seungmin", name: "Seungmin PC 1", img: "https://via.placeholder.com/60" },
    { album: "Album Giapponese", type: "Album Giapponese", member: "Changbin", name: "Changbin PC 1", img: "https://via.placeholder.com/60" },
    { album: "Album Giapponese", type: "Album Giapponese", member: "I.N.", name: "I.N. PC 1", img: "https://via.placeholder.com/60" },
    // Aggiungi altre card se necessario
  ];

  // Raggruppiamo le card per album
  const albums = {};

  photocardData.forEach(card => {
    if (!albums[card.album]) {
      albums[card.album] = [];
    }
    albums[card.album].push(card);
  });

  const albumsContainer = document.getElementById("albumsContainer");

  // Funzione per calcolare la percentuale completata
  function calculateCompletion(cards) {
    const total = cards.length;
    const checked = cards.filter(card => card.checked).length;
    return Math.round((checked / total) * 100);
  }

  // Genera ogni album
  Object.keys(albums).forEach(albumName => {
    const album = albums[albumName];

    // Creiamo il contenitore dell'album
    const albumDiv = document.createElement("div");
    albumDiv.className = "album";

    // Header dell'album
    const albumHeader = document.createElement("div");
    albumHeader.className = "album-header";
    albumHeader.innerHTML = `
      <span>${albumName}</span>
      <span id="album-${albumName}-completion">0% (${album.length} cards)</span>
    `;
    albumDiv.appendChild(albumHeader);

    // Contenuto dell'album (collapsible)
    const albumContent = document.createElement("div");
    albumContent.className = "album-content";

    album.forEach(card => {
      const cardDiv = document.createElement("div");
      cardDiv.className = "card";

      cardDiv.innerHTML = `
        <input type="checkbox" class="card-check">
        <img src="${card.img}" alt="${card.name}">
        <div class="card-info">
          <span><strong>Type:</strong> ${card.type}</span>
          <span><strong>Member:</strong> ${card.member}</span>
          <span><strong>Name:</strong> ${card.name}</span>
        </div>
      `;

      albumContent.appendChild(cardDiv);
    });

    albumDiv.appendChild(albumContent);
    albumsContainer.appendChild(albumDiv);

    // Funzione per espandere/collassare l'album
    albumHeader.addEventListener("click", () => {
      albumContent.style.display = albumContent.style.display === "flex" ? "none" : "flex";
      updateAlbumProgress(album, albumName);
    });

    // Aggiunge listener ai checkbox delle card dell'album
    albumContent.querySelectorAll(".card-check").forEach(checkbox => {
      checkbox.addEventListener("change", () => updateAlbumProgress(album, albumName));
    });
  });

  // Funzione per aggiornare la percentuale di completamento di un album
  function updateAlbumProgress(cards, albumName) {
    const completion = calculateCompletion(cards);
    document.getElementById(`album-${albumName}-completion`).innerText = `${completion}% (${cards.length} cards)`;
    updateOverallProgress();
  }

  // Funzione per aggiornare la percentuale complessiva
  function updateOverallProgress() {
    const allCards = document.querySelectorAll(".card-check");
    const checked = document.querySelectorAll(".card-check:checked");
    const total = allCards.length;
    const percent = Math.round((checked.length / total) * 100);
    document.getElementById("progress").innerText = `Completion: ${checked.length}/${total} (${percent}%)`;
  }

  // Inizializza tutto (per espandere/collassare)
  updateOverallProgress();
</script>

</body>
</html>
